# Default configuration for the Selfrace project
simulator:
  # 设备配置 - 8张显卡的分布式设置
  device: "cuda:0"  # 主设备，其他设备将在分布式训练中自动分配

  # num_envs 是每个 rank/GPU 上的并行环境数；DDP 全局环境数 = num_envs * GPU 数。
  num_envs: 100
  verbose: false         # 热路径调试日志开关，训练时保持关闭
  sim_dt: 0.3             # 模拟时间步长
  state_dim: 7             # 仿真世界状态 [x,y,yaw,speed,length,width,active]
  max_agents_num: 150     # 最大车辆数量,定义每个环境中最大可能的智能体数量
  # num_npc_vehicles <= max_agents_num，否则会报错
  num_npc_vehicles: 150   # NPC车辆数量,定义每个环境中实际生成的智能体数量
  init_candidates_per_slot: 16  # sequential rejection 初始化时每个待填slot的候选数量
  init_max_fill_attempts: 4     # 每个slot最多重采样次数，用于尽量填满目标车辆数
  init_collision_clearance: 0.0 # 初始化碰撞检测额外安全间距(m)，0表示严格按车身尺寸
  init_candidate_pool_size: 262144             # 跨reset复用的on-road候选池目标容量
  init_candidate_pool_refill_threshold: 8192   # 候选池低水位，低于此值时同步补池
  init_candidate_pool_refill_batch: 65536      # 每次补池的原始采样批量
  init_distribution_correction: true           # 按估计接受率反向修正spawn proposal
  init_distribution_calibration_samples: 65536 # 启动时用于估计每个quad接受率的样本数
  init_distribution_smoothing: 1.0             # 接受率估计平滑，避免低样本quad权重发散
  init_distribution_max_weight: 20.0           # 单个quad的最大反向修正权重

  # 地图配置  
  map_path: "./maps/processed_map_Town01_stitched.json" # 地图路径

  # Dynamics model configuration
  dynamics:
    # Action space configuration
    use_discrete_actions: true  # 是否使用离散动作空间 (12个动作)
    action_space_size: 12

    # Vehicle physical parameters
    vehicle_length_min: 0.8 # 车辆长度最小值 (m)
    vehicle_length_max: 7.0 # 车辆长度最大值 (m)
    vehicle_width_min: 0.8 # 车辆宽度最小值 (m)
    vehicle_width_max: 3.0 # 车辆宽度最大值 (m)

    vehicle_length: 4.5 # 车辆长度 (m)
    vehicle_width: 2.0 # 车辆宽度 (m)
    vehicle_wheelbase: 2.9  # 车辆轴距 (L)，前后轮轴心之间的距离 (m)
    vehicle_max_steer_angle: 35.0  # 最大前轮转向角 (度)

    # Control coefficients for driving style
    Cthrottle: 1.0  # 油门控制系数，用于调节加速度响应
    Csteer: 1.0     # 转向控制系数，用于调节转向响应
    Cacc: 1.0       # 加速度控制系数，用于调节加速度约束
    Cvel: 1.0       # 速度控制系数，用于调节速度约束
    
    # Steering control parameters
    max_steering_rate: 0.6  # 最大转向角变化率 (rad/s)
    
    # Acceleration constraints
    max_longitudinal_accel: 2.5  # 最大纵向加速度 (m/s²)
    min_longitudinal_accel: -5.0  # 最小纵向加速度 (m/s²)
    max_lateral_accel: 4.0       # 最大横向加速度 (m/s²)
    min_lateral_accel: -4.0      # 最小横向加速度 (m/s²)
    
    # Velocity constraints
    max_velocity: 20.0  # 最大速度 (m/s)
    min_velocity: -2.0  # 最小速度 (m/s)
    
    # Jerk constraints (for discrete action space)
    max_longitudinal_jerk: 4  # 最大纵向jerk (m/s³)
    min_longitudinal_jerk: -15.0 # 最小纵向jerk (m/s³)
    max_lateral_jerk: 4.0        # 最大横向jerk (m/s³)
    min_lateral_jerk: -4.0       # 最小横向jerk (m/s³)
    
    # Numerical stability parameters
    curvature_epsilon: 1e-8      # 曲率计算的数值稳定性参数
    steering_epsilon: 1e-5       # 转向角计算的数值稳定性参数
    straight_motion_threshold: 1e-5  # 直线运动判断阈值 (rad)
  
  observation:
    # Observation space config
    # 定义观测空间
    local_state_dim: 13 # 原文式 S(t): c,theta,kappa,v,v_lim,phi,a_long,a_lat,Cacc,Cthrottle,Csteer,l,w
    neighbor_feature_dim: 10 # (dx, dy, heading_x, heading_y, dvx, dvy, length, width, z, active)
    waypoint_feature_dim: 5 # W_lane raw: (dx, dy, heading_x, heading_y, lane_width)
    boundary_feature_dim: 2 # (dx, dy) for each point

    # 定义视野
    num_neighbors: 20     # 邻居数量
    num_w_lanes: 80       # 原文 W_lane 取最近80个coarse lane features
    num_w_boundaries: 80  # 原文 W_boundary 取最近80个coarse boundary features
    horizon: 200.0        # 原文 coarse map horizon 200m
    speed_limit: 20.0
    
  hash:
    # Spatial hash config - 空间哈希配置
    # 方法1：直接指定网格单元大小（米）
    hash_cell_size: 5  # 网格单元大小（米），推荐5.0m以获得更好的精度
    
    # 方法2：通过网格分辨率计算（可选，如果同时设置会覆盖hash_cell_size）
    grid_width: 1000     # 网格宽度（单元格数量）
    grid_height: 1000    # 网格高度（单元格数量）
    map_extent_m: 10000.0 # 地图范围（米），用于计算网格单元大小
    

  # Reward parameters based on Appendix B.3 and Selfrace paper
  reward:
    # Goal reward parameters (Rgoal)
    delta_goal_min: 2.0         # 目标距离阈值最小值
    delta_goal_max: 12.0        # 目标距离阈值最大值
    v_goal: 3.0                 # 目标速度阈值
    goal_reward: 1.0            # 目标奖励值
    
    # Collision penalty parameters (Rcollision)
    collision_alpha_min: 0.0    # 碰撞惩罚系数最小值
    collision_alpha_max: 3.0    # 碰撞惩罚系数最大值
    collision_speed_mult: 0.1   # 碰撞速度乘数
    
    # Off-road penalty parameters (Roff-road)
    boundary_alpha_min: 0.0     # 边界惩罚系数最小值
    boundary_alpha_max: 3.0     # 边界惩罚系数最大值
    
    # Comfort penalty parameters (Rcomfort)
    comfort_alpha_min: 0.0      # 舒适度惩罚系数最小值
    comfort_alpha_max: 0.1      # 舒适度惩罚系数最大值
    
    # Lane alignment reward parameters (R_{l-align})
    l_align_alpha_min: 2.5e-4   # 车道对齐奖励系数最小值
    l_align_alpha_max: 2.5e-2   # 车道对齐奖励系数最大值
    vel_align_alpha_min: 0.0    # 速度对齐奖励系数最小值
    vel_align_alpha_max: 1.0    # 速度对齐奖励系数最大值
    
    # Lane center reward parameters (R_{l-center})
    l_center_alpha_min: 2.5e-4  # 车道中心对齐奖励系数最小值
    l_center_alpha_max: 7.5e-3  # 车道中心对齐奖励系数最大值
    center_bias_alpha_min: -0.5 # 中心偏置系数最小值
    center_bias_alpha_max: 0.5  # 中心偏置系数最大值
    
    # Velocity reward parameters (Rvelocity)
    velocity_alpha: 2.5e-3      # 速度奖励系数
    
    # Reverse penalty parameters (Rreverse)
    reverse_alpha_min: 2.5e-4   # 倒车惩罚系数最小值
    reverse_alpha_max: 7.5e-3   # 倒车惩罚系数最大值
    
    # Stop line penalty parameters (Rstop-line)
    stop_line_alpha_min: 0.0    # 停止线违规惩罚系数最小值
    stop_line_alpha_max: 1.0    # 停止线违规惩罚系数最大值
    
    # Timestep penalty parameters (Rtimestep)
    timestep_alpha: 2.5e-5      # 时间步惩罚系数
  
  traffic:
    stop_line_width: 3.5
    stop_line_observation_count: 5
    stop_line_horizon: 100.0
    red_light_probability: 0.5

  policy:
    # agent_feature_dim and local_state_dim are now part of simulator config
    # Further network architecture configs...

training:
  # 分布式训练配置
  distributed:
    backend: "nccl"            # 分布式后端
    init_method: "tcp://localhost:12355"  # 初始化方法

  # batch_size 是全局目标批量；实际每卡 PPO 抽样量优先使用 batch_size_per_gpu。
  batch_size: 256000
  batch_size_per_gpu: 2000  # 每GPU batch size
  iteration: 10000
  
  # 修正其他参数
  rollout_length: 128 # 每个rollout的步数
  ppo_epochs: 3

  gamma: 0.999      # 改为0.999 折扣因子
  gae_lambda: 0.95  # 广义优势估计的lambda

  max_episode_length: 1200 # 每个episode的最大步数 (一个episode包含多个rollout)

  clip_ratio: 0.2
  learning_rate: 0.0005  # 5×10⁻⁴

  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  
  # 添加缺失的参数
  value_clip_ratio: null  # Value function clipping = None
  lr_schedule: "cosine"  # 改为cosine
  precision: "16-bit"  # 添加16-bit AMP
  
  # 修正advantage filtering
  advantage_filter_threshold: 0.01  # 阈值过滤
  advantage_filter_beta: 0.25       # EWMA衰减参数

  # 训练参数
  total_timesteps: 1_000_000_000_000 # As per paper

  profile:
    enabled: false       # 可选训练链路 profiler，默认关闭
    cuda_sync: false     # 打开后为计时做 CUDA 同步，会降低训练速度
    log_interval: 10     # profiler 日志间隔
  
  # 内存和性能优化
  checkpoint_interval: 100                  # 检查点保存间隔
  checkpoint_dir: "./training/checkpoints"  # 检查点保存目录
  log_interval: 10                          # 日志记录间隔
  
  # 经验缓冲区配置
  experience_buffer_capacity: 50000  # 经验缓冲区容量
  min_buffer_size_for_training: 800  # 开始训练的最小缓冲区大小

  # 模型权重初始化配置
  weight_init:
    type: "orthogonal"  # 使用Orthogonal初始化
    gain: 1.0           # Orthogonal初始化的gain参数
    bias_zero: true     # bias初始化为0

  network:
    # 特征编码器配置
    encoder_dim: 64  # 每个编码器的输出维度
    # 简单特征维度配置 - 用于SimpleFeatureEncoder
    
    # S(t), reward系数, 车辆风格参数；routing 信息由 W_lane 的 goal-distance 特征提供
    simple_feature_dims: [13, 10, 4]
    # 排列不变特征维度配置 - 用于PermutationInvariantEncoder
    # road_boundary, lane_points, stop_lines, other_agents
    permutation_feature_dims: [160, 560, 20, 200]
    permutation_element_dims: [2, 7, 2, 10]
    
    # 网络架构配置
    network_dim: 1024  # MLP隐藏层维度
    num_actions: 12    # 输出动作数量
